version: "3.9"

services:
  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sandbox
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sandbox"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "6379:6379"

  # ── Sandbox Analyzer ───────────────────────────────────────────────────────
  analyzer:
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"  # CLI-инструмент, не демон
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/sandbox
      # API ключи — передаём из .env файла
      VIRUSTOTAL_API_KEY: ${VIRUSTOTAL_API_KEY:-}
      OTX_API_KEY: ${OTX_API_KEY:-}
      SAFE_BROWSING_API_KEY: ${SAFE_BROWSING_API_KEY:-}
      CLAMAV_SOCKET: /var/run/clamav/clamd.ctl
      YARA_RULES_DIR: /app/yara-rules
    volumes:
      # Монтируем файлы для анализа (если нужно)
      - ./samples:/samples:ro
    # Пример запуска: docker-compose run --rm analyzer analyze <uuid>
    entrypoint: ["/entrypoint.sh"]
    command: ["sandbox-analyzer", "--help"]

volumes:
  postgres_data:
  redis_data:
