<div id="newAnalysisModal" class="hidden fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center z-50 animate-fade-in">
    
    <div class="bg-white rounded-2xl shadow-xl border border-gray-100 w-full max-w-md p-6 relative">
        <button onclick="toggleModal(false)" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 cursor-pointer text-xl font-bold">&times;</button>
        
        <h3 class="text-xl font-bold text-gray-800 mb-4">Параметры запуска нового анализа</h3>
        
        <!-- Добавлен enctype для корректной отправки файлов на FastAPI -->
        <form id="analysisForm" action="/analysis/new" method="POST" enctype="multipart/form-data" class="space-y-4">
<!--             
            <div>
                <label class="block text-sm font-medium text-gray-600 mb-1">Название задачи</label>
                <input type="text" name="task_name" required placeholder="Например: Сканирование ноды VNC"
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none bg-gray-50 text-gray-800">
            </div> -->
            
            <!-- TODO: Создать схему динамического выбора через шаблонизацию  -->
            <div>
                <label class="block text-sm font-medium text-gray-600 mb-1">Тип окружения</label>
                <select name="scan_type" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none bg-gray-50 text-gray-800">
                    <option value="0">default (VNC)</option>
                    <!-- <option value="quick_port">Быстрый скан портов</option>
                    <option value="full_audit">Полный аудит уязвимостей</option> -->
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-600 mb-1">Тип объекта</label>
                <select id="modalObjectType" name="object" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none bg-gray-50 text-gray-800">
                    <option value="link">Ссылка</option>
                    <!-- <option value="file">Файл</option> -->
                </select>
            </div>

            <!-- Поле для ввода Ссылки (активно по умолчанию) -->
            <div id="modalLinkContainer">
                <label class="block text-sm font-medium text-gray-600 mb-1">Вставьте ссылку</label>
                <input type="url" name="link_url" placeholder="https://example.com"
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none bg-gray-50 text-gray-800">
            </div>

            <div id="modalFileContainer" class="hidden">
                <label class="block text-sm font-medium text-gray-600 mb-1">Загрузите файл</label>
                <div id="modalDropZone" class="flex flex-col items-center justify-center w-full h-32 border-2 border-dashed border-gray-300 rounded-lg bg-gray-50 hover:bg-gray-100 cursor-pointer transition-colors duration-200">
                    <div class="flex flex-col items-center justify-center pt-5 pb-6 text-center px-4 pointer-events-none">
                        <p class="mb-1 text-sm text-gray-500 font-semibold">Перетащите файл сюда или кликните</p>
                        <p id="modalFileHint" class="text-xs text-gray-400"></p>
                    </div>
                    <input type="file" id="modalFileInput" name="file" class="hidden">
                </div>
            </div>

            <div class="flex space-x-3 pt-2">
                <button type="button" onclick="toggleModal(false)" 
                        class="w-1/2 bg-gray-100 hover:bg-gray-200 text-gray-700 font-medium py-2 rounded-lg transition cursor-pointer">
                    Отмена
                </button>
                <button type="submit" 
                        class="w-1/2 bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded-lg transition shadow-sm cursor-pointer">
                    Запустить
                </button>
            </div>
        </form>
    </div>
</div>

<<script>
    const objectTypeSelect = document.getElementById('modalObjectType');
    const linkContainer = document.getElementById('modalLinkContainer');
    const fileContainer = document.getElementById('modalFileContainer');
    const dropZone = document.getElementById('modalDropZone');
    const fileInput = document.getElementById('modalFileInput');
    const fileHint = document.getElementById('modalFileHint');
    const analysisForm = document.getElementById('analysisForm');
    
    // Находим инпут ссылки внутри контейнера
    const linkInput = linkContainer.querySelector('input');

    function toggleModal(show) {
        const modal = document.getElementById('newAnalysisModal');
        if (show) {
            modal.classList.remove('hidden');
            // Принудительно выставляем режим "ссылка" при открытии
            triggerFieldToggle('link');
        } else {
            modal.classList.add('hidden');
            analysisForm.reset();
            resetFileField();
            triggerFieldToggle('link');
        }
    }

    function triggerFieldToggle(value) {
        if (value === 'link') {
            linkContainer.classList.remove('hidden');
            fileContainer.classList.add('hidden');
            
            // Включаем валидацию для ссылки, отключаем для файла
            if (linkInput) {
                linkInput.required = true;
                linkInput.disabled = false;
            }
            fileInput.required = false;
            fileInput.disabled = true;
            
            resetFileField();
        } else {
            linkContainer.classList.add('hidden');
            fileContainer.classList.remove('hidden');
            
            // Отключаем валидацию для ссылки, включаем для файла
            if (linkInput) {
                linkInput.required = false;
                linkInput.disabled = true;
            }
            fileInput.required = true;
            fileInput.disabled = false;
        }
    }

    objectTypeSelect.addEventListener('change', function() {
        triggerFieldToggle(this.value);
    });

    dropZone.addEventListener('click', () => fileInput.click());

    ['dragenter', 'dragover'].forEach(eventName => {
        dropZone.addEventListener(eventName, (e) => {
            e.preventDefault();
            dropZone.classList.add('border-blue-500', 'bg-blue-50');
        }, false);
    });

    ['dragleave', 'drop'].forEach(eventName => {
        dropZone.addEventListener(eventName, (e) => {
            e.preventDefault();
            dropZone.classList.remove('border-blue-500', 'bg-blue-50');
        }, false);
    });

    dropZone.addEventListener('drop', (e) => {
        const dt = e.dataTransfer;
        const files = dt.files;

        if (files.length > 0) {
            fileInput.files = files; 
            updateFileInfo(files[0].name);
        }
    });

    fileInput.addEventListener('change', function() {
        if (this.files.length > 0) {
            updateFileInfo(this.files[0].name);
        }
    });

    function updateFileInfo(name) {
        fileHint.textContent = `Выбран файл: ${name}`;
        fileHint.classList.remove('text-gray-400');
        fileHint.classList.add('text-blue-600', 'font-medium');
    }

    function resetFileField() {
        fileInput.value = '';
        fileHint.textContent = "";
        fileHint.classList.remove('text-blue-600', 'font-medium');
        fileHint.classList.add('text-gray-400');
    }
</script>
