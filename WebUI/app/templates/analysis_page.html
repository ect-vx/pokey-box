<!DOCTYPE html>
<html lang="ru">

<style>
    /* Насильно заставляем внутренний холст Guacamole заполнить весь блок */
    #guac-display {
        position: relative;
    }
    #guac-display > .guacamole-display {
        width: 100% !important;
        height: 100% !important;
        position: absolute;
        top: 0;
        left: 0;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    #guac-display canvas {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain; /* Сохраняет пропорции экрана виртуалки */
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }
</style>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление анализом | pokey-box</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
    {% if analysis.status in [0, 2] %}
    <meta http-equiv="refresh" content="5">
    {% endif %}
</head>
<body class="bg-gray-900 text-gray-100 h-screen flex flex-col overflow-hidden font-sans">

    <header class="bg-gray-800 border-b border-gray-700 px-6 py-4 flex justify-between items-center shadow-md">
        <div class="flex items-center space-x-4">
            <span class="text-xl font-bold tracking-wide text-blue-400">pokey-box <span class="text-xs text-gray-500">{{ version }}</span></span>
            <span class="text-sm bg-gray-700 text-gray-300 px-3 py-1 rounded-md border border-gray-600">ID: {{ analysis.id }}</span>
        </div>
        <a href="/dashboard" class="bg-gray-700 hover:bg-gray-600 text-sm font-medium px-4 py-2 rounded-lg transition">
            Вернуться в панель
        </a>
    </header>

    <main class="flex-1 p-6 flex flex-col justify-center items-center overflow-hidden max-w-7xl w-full mx-auto">
        
        {% if analysis.status == 3 %}

        <div id="guac-display" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; bg: #000; z-index: 9999; overflow: auto;">
            <div id="guac-loader" style="color: #fff; padding: 20px;">Подключение к WebSocket...</div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/@cyolosecurity/guacamole-common-js@1.5.5-1/dist/guacamole-common.min.js"></script>

        <script>
            document.addEventListener("DOMContentLoaded", function () {
                const token = "{{ analysis.token }}"; 
                const displayContainer = document.getElementById('guac-display');

                const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
                const wsUrl = `${protocol}//${window.location.host}/ws/tunnel`;

                const tunnel = new Guacamole.WebSocketTunnel(wsUrl);
                const client = new Guacamole.Client(tunnel);

                // Как только пошла сессия — удаляем текст загрузки
                client.onstatechange = function(state) {
                    if (state === 3) { 
                        const loader = document.getElementById('guac-loader');
                        if (loader) loader.remove();
                    }
                };

                // Добавляем чистый элемент дисплея
                const element = client.getDisplay().getElement();
                displayContainer.appendChild(element);

                // Жестко задаем размеры прямо в guacd при старте (например, HD)
                client.sendSize(1280, 720);

                // Простейшая мышь без масштабирования координат
                const mouse = new Guacamole.Mouse(element);
                mouse.onmousedown = mouse.onmouseup = mouse.onmousemove = function(mouseState) {
                    client.sendMouseState(mouseState);
                };

                // Простейшая клава
                const keyboard = new Guacamole.Keyboard(document);
                keyboard.onkeydown = function (keysym) { client.sendKeyEvent(1, keysym); };
                keyboard.onkeyup = function (keysym) { client.sendKeyEvent(0, keysym); };

                // Коннект с чистым токеном
                client.connect(`token=${encodeURIComponent(token)}`);
            });
        </script>
